<main class="container">
    <section class="container__header">
        <h1>Audio Viewer</h1>
        <input type="file" accept="audio/*" (change)="onFileCharge($event)" />
    </section>

    <section class="container__bars">
        <app-bars [bars]="bars" [svgWidth]="svgWidth" [svgHeight]="svgHeight" [barsCount]="barsCount"></app-bars>
    </section>

    <section class="container__controls">
        <div>
            <app-action-button text="Play"></app-action-button>
            <app-action-button text="Pause"></app-action-button>
            <app-action-button text="Stop"></app-action-button>
        </div>
        <div>
            <app-action-button text="Wave"></app-action-button>
            <app-action-button text="Radial"></app-action-button>
            <app-action-button text="Bars"></app-action-button>
        </div>
    </section>

</main>
