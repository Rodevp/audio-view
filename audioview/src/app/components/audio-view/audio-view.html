<main class="container">
    <section class="container__header">
        <h1>Audio Viewer</h1>
        <div class="container__header__controls">
            <div>
                <input type="file" accept="audio/*" (change)="onFileCharge($event)" #fileInput hidden />
                <app-icon-button (click)="openFileDialog()">
                    <lucide-icon [name]="UploadIcon" size="15"></lucide-icon>
                </app-icon-button>
            </div>
            <app-icon-button (click)="changeTheme()">
                @if (theme === 'dark') {
                <lucide-icon [name]="SunIcon" size="15"></lucide-icon>
                }
                @else {
                <lucide-icon [name]="MoonIcon" size="15"></lucide-icon>
                }
            </app-icon-button>
        </div>
    </section>

    <section class="container__bars">
        @if(currentGraphic === 'bars') {
        <app-bars [bars]="bars" [svgWidth]="svgWidth" [svgHeight]="svgHeight" [barsCount]="barsCount"></app-bars>
        }
        @if (currentGraphic == 'wave') {
        <app-wave [wavePath]="wavePath" [svgHeight]="svgHeight"></app-wave>
        }
        @if (currentGraphic == 'radial') {
        <app-radial [radialPoints]="radialPoints" [radialIntensity]="radialIntensity"
            [svgHeight]="svgHeight"></app-radial>
        }
    </section>

    <section class="container__controls">
        <div>
            <app-action-button [selected]="selected === 'play'" text="Play"
                (click)="playSound(); changeSelected('play')"></app-action-button>
            <app-action-button [selected]="selected === 'pause'" text="Pause"
                (click)="pauseSound(); changeSelected('pause')"></app-action-button>
            <app-action-button [selected]="selected === 'stop'" text="Stop"
                (click)="stop(); changeSelected('stop')"></app-action-button>
        </div>
        <div>
            <app-action-button [selected]="selected === 'wave'" text="Wave"
                (click)="changeGraphic('wave')"></app-action-button>
            <app-action-button [selected]="selected === 'radial'" text="Radial"
                (click)="changeGraphic('radial')"></app-action-button>
            <app-action-button [selected]="selected === 'bars'" text="Bars"
                (click)="changeGraphic('bars')"></app-action-button>
        </div>
    </section>

</main>
